# Two independent mock instances in one alias (D-047), so fallback can be tested
# and measured without keys. No real provider is called.
# Use it with: $env:LLMGATEWAY_CONFIG = "config/mock-fallback.toml"
#
# 30% of mock-primary's attempts fail (measurement 4's injected failure rate). The
# router retries them (D-050), and a request whose attempts all fail moves to
# mock-secondary (D-060).
#
# For an outage, set LLMGATEWAY_FAULTS (D-064). Measurement 8's is
# $env:LLMGATEWAY_FAULTS = "mock-primary=1.0@60+30": 100% failure from 60 s after
# the instance's first call, for 30 s.

[providers.mock-primary]
type = "mock"
latency_ms = 20
failure_rate = 0.3
failure_type = "unavailable"
seed = 1

[providers.mock-secondary]
type = "mock"
latency_ms = 40
failure_rate = 0.0
seed = 2

[aliases]
mock-fallback = [
    { provider = "mock-primary", model = "mock-a" },
    { provider = "mock-secondary", model = "mock-b" },
]
