# Real providers (D-047). Real calls cost money.
# Needs ANTHROPIC_API_KEY and GEMINI_API_KEY in the environment; keys never go in
# this file (D-044). Use it with: $env:LLMGATEWAY_CONFIG = "config/providers.toml"
#
# Each alias lists (provider instance, provider model) pairs in fallback order
# (D-010). Until M11, only the first entry is used.

[providers.claude]
type = "claude"

[providers.gemini]
type = "gemini"

[aliases]
fast = [
    { provider = "gemini", model = "gemini-3.5-flash-lite" },
    { provider = "claude", model = "claude-haiku-5-5" },
]
smart = [
    { provider = "claude", model = "claude-opus-5-5" },
    { provider = "gemini", model = "gemini-3.6-flash" },
]
