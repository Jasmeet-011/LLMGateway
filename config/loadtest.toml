# The load tests' config (M18, D-119). Mocks only: no real provider is called.
# Selected by loadtest/compose.loadtest.yaml with
# LLMGATEWAY_CONFIG=/app/config/loadtest.toml; the image copies config/.
#
# One alias per kind of run, so one image serves every measurement:
# - steady: measurements 1, 2, 3 and 5; a healthy 20 ms mock.
# - failures-off and failures-on: measurement 4, A and B (D-120). mock-primary and
#   mock-secondary have the same settings as config/mock-fallback.toml.
# - outage-off and outage-on: measurement 8. mock-outage is healthy until
#   loadtest/compose.outage.yaml's fault window (D-064).

[providers.mock-steady]
type = "mock"
latency_ms = 20
failure_rate = 0.0
seed = 3

[providers.mock-primary]
type = "mock"
latency_ms = 20
failure_rate = 0.3
failure_type = "unavailable"
seed = 1

[providers.mock-secondary]
type = "mock"
latency_ms = 40
failure_rate = 0.0
seed = 2

[providers.mock-outage]
type = "mock"
latency_ms = 20
failure_rate = 0.0
seed = 4

[aliases]
steady = [
    { provider = "mock-steady", model = "mock-a" },
]
failures-off = [
    { provider = "mock-primary", model = "mock-a" },
]
failures-on = [
    { provider = "mock-primary", model = "mock-a" },
    { provider = "mock-secondary", model = "mock-b" },
]
outage-off = [
    { provider = "mock-outage", model = "mock-a" },
]
outage-on = [
    { provider = "mock-outage", model = "mock-a" },
    { provider = "mock-secondary", model = "mock-b" },
]
