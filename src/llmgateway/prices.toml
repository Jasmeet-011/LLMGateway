# "$1.50 starting January 1, 2027" and "$7.50 starting January 1, 2027".
[[gemini."gemini-3.6-flash"]]
from = 2027-01-01
input = "1.50"
output = "7.50"
source = "https://aistudio.google.com/docs/pricing"
checked = 2026-11-11
