# CI on Linux (D-080). No secrets: the live tests are deselected and no key is set.
# Actions are pinned by commit SHA and uv by version, under the age floor (D-079).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: check.ps1
    runs-on: ubuntu-24.04
    # D-066's per-test limit ends a hung test; this is the outer guard.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          python-version: "3.12.12"
      # The same five checks, in the same order, as every local run.
      - name: Run check.ps1
        shell: pwsh
        run: ./scripts/check.ps1

  compose:
    name: Compose and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          python-version: "3.12.12"
      - name: Install the test environment
        run: uv sync --locked
      - name: Build and start the stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Integration tests (D-081)
        env:
          LLMGATEWAY_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest -m integration -v
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
